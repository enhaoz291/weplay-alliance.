<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>點數兌換</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 { text-align:center; }
        label { display:block; margin-top:15px; }
        input, select { margin-top:5px; padding:5px; width:100%; max-width:400px; }
        .gift-list { margin-top:10px; }
        .gift-list label { display:block; }
        .cart { background:#1a1a1a; padding:10px; margin-top:10px; }
        button { margin-top:20px; padding:10px 20px; background:#4da6ff; border:none; color:white; cursor:pointer; }
    </style>
</head>
<body>

<h1>1族/5族 點數兌換</h1>

<form id="exchangeForm">

    <!-- 1. 選擇家族 -->
    <label>選擇家族：
        <select name="family">
            <option value="1">1族</option>
            <option value="5">5族</option>
        </select>
    </label>

    <!-- 2. 成員ID -->
    <label>成員ID：
        <input type="text" name="memberID" placeholder="請輸入成員ID或名稱">
    </label>

    <!-- 3. 選擇禮物 -->
    <label>選擇禮物：</label>
    <div class="gift-list">
        <label><input type="checkbox" name="gift" value="禮物A" data-price="100"> 禮物A - 100點</label>
        <label><input type="checkbox" name="gift" value="禮物B" data-price="200"> 禮物B - 200點</label>
        <label><input type="checkbox" name="gift" value="禮物C" data-price="300"> 禮物C - 300點</label>
        <!-- 之後可自行新增 -->
    </div>

    <!-- 4. 填寫金額 / 額外說明 -->
    <label>額外填寫（活動禮物 / 莊園禮物名稱）：
        <input type="text" name="extra" placeholder="請輸入文本">
    </label>

    <!-- 5 & 6. 確認訂單 / 送出 -->
    <button type="button" onclick="submitOrder()">送出訂單</button>

</form>

<div id="orderResult" class="cart"></div>

<script>
function submitOrder() {
    const form = document.getElementById('exchangeForm');
    const family = form.family.value;
    const memberID = form.memberID.value.trim();
    const gifts = Array.from(form.gift)
                   .filter(g => g.checked)
                   .map(g => g.value + " (" + g.dataset.price + "點)");
    const extra = form.extra.value.trim();

    if (!memberID) {
        alert("請輸入成員ID");
        return;
    }
    if (gifts.length === 0) {
        alert("請至少選擇一個禮物");
        return;
    }

    const orderText = `
        家族: ${family}族<br>
        成員ID: ${memberID}<br>
        選擇禮物: ${gifts.join(', ')}<br>
        額外說明: ${extra || "無"}<br>
        訂單狀態: 待人工確認
    `;

    document.getElementById('orderResult').innerHTML = orderText;
}
</script>

</body>
</html>
