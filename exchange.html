<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>點數兌換</title>
<style>
body {
    background-color: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
}
h1 { text-align:center; margin-top:30px; }
label { display: block; margin-top: 15px; }
.gift-list { margin-top:10px; max-width:500px; }
.gift-list label { display:flex; justify-content:space-between; align-items:center; padding:10px 5px; border-bottom:1px solid #222; }
.qty { display:flex; align-items:center; gap:5px; }
.qty input { width:40px; text-align:center; background:#1a1a1a; border:1px solid #333; color:white; font-size:16px; }
.qty button { background:#4da6ff; border:none; color:white; padding:4px 8px; cursor:pointer; font-size:16px; }
.qty button:hover { background:#3399ff; }
#totalPoints { margin-top:15px; font-weight:bold; }
iframe { margin-top:20px; }
</style>
</head>
<body>

<h1>1族 / 5族 點數兌換</h1>

<div class="gift-list">
<label>
    天選之人（300兑幣）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="300" data-name="天選之人">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>

<label>
    活動100禮物（100兑幣）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="100" data-name="活動100禮物">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>

<label>
    活動200禮物（200兑幣）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="200" data-name="活動200禮物">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>

<label>
    活動1200禮盒（1200兑幣）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="1200" data-name="活動1200禮盒">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>

<label>
    活動盲盒（1888兑幣）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="1888" data-name="活動盲盒">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>

<label>
    其它禮物（請於備註填寫）
    <div class="qty">
        <button type="button" onclick="changeQty(this,-1)">-</button>
        <input type="text" value="0" readonly data-price="0" data-name="其它禮物">
        <button type="button" onclick="changeQty(this,1)">+</button>
    </div>
</label>
</div>

<div id="totalPoints">總點數: 0</div>

<!-- Google 表單嵌入 -->
<iframe src="https://docs.google.com/forms/d/e/你的表單ID/viewform?embedded=true" 
        width="640" height="1000" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>

<script>
function changeQty(btn, delta){
    const input = btn.parentElement.querySelector('input');
    let val = parseInt(input.value);
    val += delta;
    if(val<0) val=0;
    input.value = val;
    updateTotal();
}

function updateTotal(){
    const inputs = document.querySelectorAll('.gift-list input');
    let total = 0;
    let otherSelected = false;
    inputs.forEach(input => {
        const qty = parseInt(input.value);
        const price = parseInt(input.dataset.price);
        if(qty>0){
            total += price*qty;
            if(input.dataset.name === '其它禮物') otherSelected = true;
        }
    });
    let display = total;
    if(otherSelected) display += " + 其它禮物所需點數";
    document.getElementById('totalPoints').innerText = "總點數: " + display;
}
</script>

</body>
</html>
